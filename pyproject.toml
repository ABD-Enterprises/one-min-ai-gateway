[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "one-min-ai-gateway"
version = "0.1.1"
description = "OpenAI-compatible gateway for 1min.ai"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "deffenda" }]
dependencies = [
  "flask>=3.0,<4.0",
  "requests>=2.31,<3.0",
  # server.py imports the urllib3 2.x connection API directly.
  "urllib3>=2.0,<3.0",
  "waitress>=3.0,<4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10.0",
  "mypy>=1.8,<3.0",
  "ruff>=0.12,<0.18",
  "types-requests>=2.31,<3.0",
]

[project.scripts]
one-min-ai-gateway = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
disable_error_code = ["import-untyped"]
exclude = ["tests/"]

[tool.ruff.lint]
# Keep the rule set that ruff applied by default through 0.15 (ruff 0.17 reports more by
# default). Adopting the wider set means fixing the findings it reports, which is a separate change.
select = ["E4", "E7", "E9", "F"]
