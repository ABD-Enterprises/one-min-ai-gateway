# Generated by orc adopt --with-workflows from v8.0.1.
# Runs orc's repo-agnostic CI-parity guards (the ADOPTER_READY set) against THIS repo, so an adopter
# inherits orc's guard fixes (e.g. the process.exit-before-flush truncation class, Windows-breaking
# path idioms) instead of only the engine. Copy-in: it fetches the pinned guard bundle at run time,
# so there is no cross-repo reusable to resolve (private->private `uses:` fails under enterprise
# Actions policy).
name: ORC Code Guards

on:
  pull_request:

permissions:
  contents: read

jobs:
  orc-code-guards:
    # GitHub-hosted Ubuntu is the adopter default. To opt into self-hosted,
    # replace with your runner-label JSON array, for example:
    # ["self-hosted","macOS","ARM64"]
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
      - name: Fetch + run orc adopter guards (pinned v8.0.1)
        shell: bash
        env:
          # orc is a PRIVATE repo: the workflow-scoped GITHUB_TOKEN is limited to THIS repo and cannot
          # read orc. Provide a PAT or GitHub App installation token with read access to
          # ABD-Enterprises/orc as the ORC_GUARDS_TOKEN secret. (If orc is public to you, github.token
          # works and the secret can be omitted.) The token is masked in logs.
          ORC_GUARDS_TOKEN: ${{ secrets.ORC_GUARDS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Fetch the guard bundle OUTSIDE the workspace: the guards walk --root recursively, and the
          # bundle carries their own detection-pattern fixtures — nesting it inside the scanned tree
          # would make a clean repo fail. RUNNER_TEMP is outside GITHUB_WORKSPACE.
          bundle="${RUNNER_TEMP}/orc-guards"
          rm -rf "$bundle"
          # #2578: an adopter that has not provisioned ORC_GUARDS_TOKEN cannot read a private orc —
          # the `|| github.token` fallback above is repo-scoped and guarantees this clone fails. That
          # used to abort under `set -e` as a bare "exit code 128", so every PR in the adopted repo
          # carried a red check that read like a guard violation. Not being able to FETCH the guards
          # is a setup gap, not a code defect: report it and skip. Guard violations still fail below.
          # #2966: fetch the EXACT engine object, not a branch/tag. `--branch v8.0.1` was a
          # mutable ref: moving that tag silently swapped the guards every adopted repo runs, and
          # nothing here could tell. Asking for the commit by id removes the question rather than
          # verifying it after the fact. `git fetch origin <ref>` takes a SHA or a tag, so this one
          # path also covers a render that could not resolve a SHA.
          if ! { git clone --depth 1 --filter=blob:none --sparse --no-checkout \
                   "https://x-access-token:${ORC_GUARDS_TOKEN}@github.com/ABD-Enterprises/orc.git" "$bundle" \
                 && git -C "$bundle" fetch --depth 1 origin "8e171efad94902c5419bb1873e47ed2662d3e022" \
                 && git -C "$bundle" checkout --quiet FETCH_HEAD; } \
               2>"${RUNNER_TEMP}/orc-guards-clone.err"; then
            # The clone URL embeds the token, so stderr is redacted before it reaches the log.
            sed 's/x-access-token:[^@]*@/x-access-token:***@/g' "${RUNNER_TEMP}/orc-guards-clone.err" >&2 || true
            echo "::warning title=ORC guards did NOT run::Could not fetch the guard bundle (ABD-Enterprises/orc @ v8.0.1). If orc is private, set the ORC_GUARDS_TOKEN repository secret to a token with read access to it. This check passed WITHOUT running any guard."
            # A skipped guard is only safe if the skip is visible: the job summary states it in the
            # PR's own checks UI, so "green" here cannot be mistaken for "guards passed".
            {
              echo "### ORC Code Guards — skipped"
              echo ""
              echo "The pinned guard bundle could not be fetched, so **no guard ran**. This check is"
              echo "green because the guards are unavailable, not because the code passed them."
              echo ""
              echo "Fix: add an \`ORC_GUARDS_TOKEN\` repository secret with read access to"
              echo "\`ABD-Enterprises/orc\`, then re-run this check."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Belt and braces: if the server ever answered with something other than what we asked for,
          # the guards below are not the pinned ones. Refuse to run them, and make the refusal as
          # visible as the unfetchable-bundle skip above (#2578) — a guard that did not run must
          # never read as a guard that passed.
          pinned="8e171efad94902c5419bb1873e47ed2662d3e022"
          if printf '%s' "$pinned" | grep -Eq '^[0-9a-f]{40}$'; then
            got="$(git -C "$bundle" rev-parse HEAD)"
            if [ "$got" != "$pinned" ]; then
              echo "::warning title=ORC guards did NOT run::Guard bundle resolved to $got, expected the pinned $pinned. Refusing to run guards from an unexpected commit. This check passed WITHOUT running any guard."
              {
                echo "### ORC Code Guards — skipped (pin mismatch)"
                echo ""
                echo "The guard bundle resolved to \`$got\`, not the pinned \`$pinned\`, so **no guard ran**."
                echo "This check is green because the guards were not the pinned ones, not because the code passed them."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          git -C "$bundle" sparse-checkout set tools/validators
          # Past this point a non-zero exit means the guards found violations — the one thing that
          # SHOULD fail this check.
          node "$bundle/tools/validators/run-adopter-guards.mjs" --root "$GITHUB_WORKSPACE" --ref "v8.0.1"
