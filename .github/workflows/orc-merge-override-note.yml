# Generated by orc adopt --with-workflows from orc-standards@v8.0.1 — overwrite via 'orc adopt --force --with-workflows'.
# Do not hand-edit; tracked drift will be detected by 'orc adopt' on the next run.
# Implements ORC policy merge-override discipline + ORC policy mechanism tier 2:
# when a PR merges with a required branch-protection check in a
# non-SUCCESS terminal state at merge time (admin override or
# auto-merge-without-required-checks), post a `merge_override:` note on
# the linked issue so the ORC policy evidence trail captures the override.
#
# Behavior:
#   - Triggers on pull_request.closed events ONLY when the PR was merged.
#   - Looks up the default branch's required checks via the branch
#     protection API. If none configured, exits (nothing to audit).
#   - Walks the merge SHA's check-runs + statuses; identifies any
#     required check whose conclusion is FAILURE/TIMED_OUT/CANCELLED/
#     ACTION_REQUIRED at merge time (per ticket #161 recommendation b —
#     false-positive-free).
#   - If override detected, resolves the linked issue (via PR body
#     "Closes #N" / "Fixes #N") and posts the `merge_override:` note
#     there. Idempotent: skips if already posted on this issue for this
#     PR.
#   - If the linked issue carries `override-documented` label, the note
#     references that acknowledgement and still records the trail.
#
# Read-only on labels and PR/issue state; only POSTS one comment on the
# linked issue per detected override. The override itself remains
# allowed — the trail is the deliverable, not a new block.
name: ORC merge-override note
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: write
  # REQUIRED: the check-runs API needs `checks: read` on private repos. Without it the query
  # 403s, and because the audit then sees no failed checks it records "all required checks
  # SUCCESS" — on a merge override where one actually failed (#2496).
  checks: read

concurrency:
  # Per-PR grouping so a newer push cancels in-flight runs on the same PR/ref.
  group: orc-merge-override-note-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    # GitHub-hosted Ubuntu is the adopter default. To opt into self-hosted,
    # replace with your runner-label JSON array, for example:
    # ["self-hosted","macOS","ARM64"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request != null && github.event.pull_request.merged == true
    env:
      BASH_ENV: ""
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Detect override and post note on linked issue
        env:
          # #2949: the protection API needs repository-administration permission, which is NOT
          # expressible in a workflow `permissions:` block, so an adopter that provisions a token
          # with that access gets a real audit instead of a permanent red.
          #
          # #3071: that token must be scoped to THIS repo. v8.0.0 borrowed ORC_GUARDS_TOKEN, which
          # orc-code-guards.yml documents as READ ACCESS TO THE PRIVATE ORC REPO — nothing more. Since
          # GH_TOKEN outranks GITHUB_TOKEN for `gh`, every call below then ran with a credential that
          # cannot see the adopter, GitHub answered 404 (its response for a hidden resource, not 403),
          # and the 404 branch called that "not protected" and exited clean. Following the
          # documentation silently disabled the audit. Its own secret now, or the repo's own token.
          GH_TOKEN: ${{ secrets.ORC_PROTECTION_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Resolve default branch + required checks
          default_branch=$(gh api "repos/$REPO" --jq '.default_branch' 2>/dev/null || echo "main")
          # Same fail-open shape as the check-runs query below: this API also needs elevated
          # permission on private repos, and swallowing its failure made an unreadable protection
          # config indistinguishable from "no required checks configured" — so the audit exited
          # clean on a repo that does have required checks (#2496).
          if ! required=$(gh api "repos/$REPO/branches/$default_branch/protection" --jq '.required_status_checks.contexts[]?' 2>&1); then
            # #2949: "I was not allowed to look" is NOT "I looked and it was bad". Reported as its own
            # state, naming the fix. This does NOT undo #2496: that refused to report a CLEAN AUDIT on
            # an unreadable config; this reports no audit at all. Saying "I could not look" is the
            # honest answer to being unable to look; claiming clean would not be.
            report_no_audit() {
              echo "::warning title=merge-override audit did NOT run::$1 This check is green because the audit could not run, NOT because the merge was clean. Provision an ORC_PROTECTION_TOKEN repository secret, scoped to THIS repo, with repository-administration read access."
              {
                echo "### Merge-override audit — skipped (no permission)"
                echo ""
                echo "Reading branch protection needs repository-administration permission, which a"
                echo "workflow \`permissions:\` block cannot grant. **No audit ran** — this check is"
                echo "green because it could not look, not because the merge was clean."
                echo ""
                echo "Fix: add an \`ORC_PROTECTION_TOKEN\` repository secret, scoped to THIS repo,"
                echo "with that read access."
              } >> "$GITHUB_STEP_SUMMARY"
            }
            case "$required" in
              *"Branch not protected"*|*"Not Found"*)
                # #3071: 404 is ALSO what GitHub returns for a resource this token cannot SEE, so
                # "Not Found" alone can never mean "not protected". Two distinct ways it lies:
                #
                #   a) the token cannot see $REPO at all (the v8.0.0 wrong-token case);
                #   b) the token CAN see $REPO but lacks Administration read — the protection
                #      endpoint needs Administration, `repos/$REPO` needs only Metadata, so the repo
                #      probe returns 200 while protection still 404s. This is the DEFAULT
                #      `github.token` case, i.e. every adopter without the secret.
                #
                # (b) is why probing visibility alone is not enough: it is exactly the fallback path,
                # so trusting it would leave the common configuration silently fail-open. A 404 is
                # only believed as "unprotected" when the token demonstrably has admin on this repo.
                repo_admin=$(gh api "repos/$REPO" --jq '.permissions.admin // false' 2>/dev/null || echo "unreadable")
                if [ "$repo_admin" != "true" ]; then
                  if [ "$repo_admin" = "unreadable" ]; then
                    report_no_audit "This token cannot read $REPO at all, so a 404 on its branch protection says nothing about whether $default_branch is protected."
                  else
                    report_no_audit "This token can see $REPO but does not hold Administration read, which the branch-protection API requires — so its 404 is 'you may not look', not 'there is nothing there'."
                  fi
                  exit 0
                fi
                echo "::notice::default branch is not protected; nothing to audit"
                exit 0 ;;
              *403*|*"Resource not accessible"*|*"Must have admin"*|*"administration"*)
                # This fired on EVERY merge for any adopter without the secret — 8 of 8 in one repo —
                # so a genuine override would have landed as run nine of an unbroken red streak.
                report_no_audit "No permission to read branch protection for $default_branch."
                exit 0 ;;
              *)
                echo "::error::merge-override audit could not read branch protection for $default_branch: $required"
                echo "::error::cannot distinguish 'no required checks' from 'could not read them' — refusing to report a clean audit"
                exit 1 ;;
            esac
          fi
          if [ -z "$required" ]; then
            echo "::notice::no required_status_checks configured; nothing to audit"
            exit 0
          fi

          # Walk check-runs + statuses at the head SHA.
          # These are the audit's INPUTS. Swallowing a failure here (the old `|| true`) let an
          # unreadable response look like "no failed checks", so the audit affirmatively recorded
          # a clean bill of health it had not established. An audit that cannot read its inputs
          # reports that it could not audit — it does not emit a verdict (#2496).
          if ! runs=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --jq '.check_runs[]? | "\(.name)|\(.conclusion // "")"' 2>&1); then
            echo "::error::merge-override audit could not read check-runs for $HEAD_SHA: $runs"
            echo "::error::refusing to record an audit result from unreadable inputs — a clean verdict here would be false"
            exit 1
          fi
          if ! statuses=$(gh api "repos/$REPO/commits/$HEAD_SHA/statuses?per_page=100" --jq '.[]? | "\(.context)|\(.state // "")"' 2>&1); then
            echo "::error::merge-override audit could not read commit statuses for $HEAD_SHA: $statuses"
            exit 1
          fi

          failed=$(python3 - "$required" "$runs" "$statuses" <<'PY'
          import sys
          required = set(filter(None, sys.argv[1].split('\n')))
          runs_raw, statuses_raw = sys.argv[2], sys.argv[3]
          def parse(text):
              out = {}
              for line in text.splitlines():
                  if '|' not in line: continue
                  name, conc = line.split('|', 1)
                  out.setdefault(name, conc)
              return out
          runs = parse(runs_raw); statuses = parse(statuses_raw)
          non_success = {"failure","FAILURE","timed_out","TIMED_OUT","cancelled","CANCELLED","action_required","ACTION_REQUIRED","startup_failure","STARTUP_FAILURE","error","ERROR"}
          hits = []
          for name in required:
              conc = runs.get(name, statuses.get(name, ""))
              if conc in non_success:
                  hits.append(f"{name}={conc}")
          print('\n'.join(hits))
          PY
          )
          if [ -z "$failed" ]; then
            echo "::notice::all required checks SUCCESS at merge time; no override"
            exit 0
          fi

          # Resolve linked issue via PR body (Closes/Fixes/Resolves #N)
          pr_body=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq .body 2>/dev/null || echo "")
          linked_issue=$(echo "$pr_body" | grep -oiE '(closes|fixes|resolves)[[:space:]]+#[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -z "$linked_issue" ]; then
            echo "::warning::override detected but no linked issue in PR body; trail won't land. Failed: $failed"
            exit 0
          fi

          # Idempotency: skip if our note already exists on the issue for this PR
          marker="<!-- orc-merge-override:pr-${PR_NUMBER} -->"
          existing=$(gh issue view "$linked_issue" --repo "$REPO" --json comments --jq ".comments | map(select(.body | contains(\"$marker\"))) | length" 2>/dev/null || echo "0")
          if [ "${existing:-0}" != "0" ]; then
            echo "::notice::note already posted on issue #$linked_issue; skipping"
            exit 0
          fi

          # Check for override-documented label
          has_doc_label=$(gh issue view "$linked_issue" --repo "$REPO" --json labels --jq '.labels | map(.name) | any(. == "override-documented")' 2>/dev/null || echo "false")
          ack_note=""
          if [ "$has_doc_label" = "true" ]; then
            ack_note=$'\n\n_The `override-documented` label is set on this issue, so this note is recorded for trail only — operator acknowledged the override._'
          fi

          body=$(cat <<EOF
          $marker
          **Merge-override detected on PR #$PR_NUMBER** — per ORC policy merge-override discipline + ORC policy mechanism tier 2.

          \`\`\`
          merge_override: $failed
          reason: (operator: replace with one-line reason or add 'override-documented' label)
          merged_by: $MERGED_BY
          head_sha: $HEAD_SHA
          \`\`\`

          This issue is the ORC policy evidence anchor; the override itself remains permitted, but the audit trail must capture it. Add a follow-up comment naming the reason, or add the \`override-documented\` label to acknowledge.$ack_note
          EOF
          )
          gh issue comment "$linked_issue" --repo "$REPO" --body "$body"
          echo "::notice::merge-override note posted on issue #$linked_issue"
