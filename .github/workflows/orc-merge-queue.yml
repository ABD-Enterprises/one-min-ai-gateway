# Generated by orc adopt --with-workflows from v8.0.1.
name: ORC Merge Queue

on:
  # Direct triggers so the copy-in (air-gapped) variant runs standalone in the consumer
  # repo: merge_group is the merge-queue check; pull_request validates PRs pre-queue.
  merge_group:
  pull_request:

permissions:
  contents: read

jobs:
  # Job id is load-bearing: GitHub composes the check context as "<workflow name> / <job id>",
  # so this must stay `call` to emit ORC_MERGE_QUEUE_REQUIRED_CONTEXT ("ORC Merge Queue / call")
  # in tools/orc/commands/adopt.mjs. Renaming it makes the armed ruleset require a context
  # nothing produces, which freezes the default branch permanently (#2495).
  call:
    # GitHub-hosted Ubuntu is the adopter default. To opt into self-hosted,
    # replace with your runner-label JSON array, for example:
    # ["self-hosted","macOS","ARM64"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"
      - name: Repo verify gate
        shell: bash
        env:
          ORC_MERGE_QUEUE_SETUP: ${{ vars.ORC_MERGE_QUEUE_SETUP || env.ORC_MERGE_QUEUE_SETUP }}
        run: |
          setup_ran=false
          if [ -n "${ORC_MERGE_QUEUE_SETUP:-}" ]; then
            if ! bash -lc "$ORC_MERGE_QUEUE_SETUP"; then
              echo "ORC_MERGE_QUEUE_SETUP failed; refusing to run the repo verify gate."
              exit 1
            fi
            echo "ORC_MERGE_QUEUE_SETUP ran successfully."
            setup_ran=true
          fi

          if [ -f scripts/verify.sh ]; then
            if [ "$setup_ran" = true ]; then
              bash scripts/verify.sh
            elif [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f Pipfile ] || [ -f setup.py ]; then
              echo "scripts/verify.sh needs a runtime this portable check does not install; ORC merge queue check is a portable placeholder. Set ORC_MERGE_QUEUE_SETUP to the install command, or route the real gate through the repo's own CI."
            else
              bash scripts/verify.sh
            fi
          else
            echo "scripts/verify.sh not present; ORC merge queue check is a portable placeholder."
          fi
