name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  # Pull-request runs share a group per pull request, so a new push supersedes
  # the one in flight. Every push or tag run publishes the image, so each is
  # keyed by its run id: GitHub keeps at most one pending run per group, and
  # sharing a group would drop a queued release even with cancel-in-progress off.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The fallback is the value the repository variable holds. This repository is
    # public, and no self-hosted runner group admits public repositories, so a
    # self-hosted fallback would queue forever.
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    # Measured 2026-10-31 over the last 17 successful runs: at most 0.6 min of running time.
    timeout-minutes: 10
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest

  publish-image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["ubuntu-latest"]') }}
    # Measured 2026-10-31 over the last 8 successful runs: at most 4.0 min of running time
    # (median 2.2). The arm64 half of the build runs under QEMU, so the headroom is wider.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Start with fresh Git metadata on self-hosted runners
        working-directory: ${{ runner.temp }}
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?}"
          test "$workspace" != /
          rm -rf -- "$workspace/.git"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
