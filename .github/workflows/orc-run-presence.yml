# Generated by orc adopt --with-workflows from orc-standards@v8.0.0 — overwrite via 'orc adopt --force --with-workflows'.
# Do not hand-edit; tracked drift will be detected by 'orc adopt' on the next run.
# Copy-in workflow — self-contained server-visible loop-run attestation check.
name: ORC Run Presence

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  # #3035: do NOT cancel — this is a REQUIRED check that ORC itself retriggers. `labeled`, `unlabeled`
  # and `edited` are triggers, and ORC changes labels and edits PRs as normal operation (state
  # transitions, claiming, posting the attestation). So finish-pr's own attestation fired a new run
  # that cancelled the one already in flight, GitHub reported the cancelled run as `failure`, and the
  # required check went red on a PR nothing was wrong with — a loop ORC drove itself into.
  #
  # Same conclusion as #1788 for the security workflow: the group still SERIALISES runs, so there is no
  # parallel double-load on a self-hosted runner, but a superseded run COMPLETES instead of leaving a
  # cancelled check-suite at the head SHA that the merge queue then blocks on.
  group: orc-run-presence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  run-presence:
    # GitHub-hosted Ubuntu is the adopter default. To opt into self-hosted,
    # replace with your runner-label JSON array, for example:
    # ["self-hosted","macOS","ARM64"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASH_ENV: ""
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - name: Merge-group status producer
        if: github.event_name == 'merge_group'
        run: |
          echo "::notice::ORC run-presence is enforced on pull_request events where the PR number is available."

      - name: Check ticket run-presence attestation
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # #2511: the commit the attestation must cover. github.event.pull_request.head.sha is
          # the PR head — the code actually being merged — not the merge commit.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          pr_json=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body,headRefName,labels,author)
          pr_body=$(jq -r '.body // ""' <<<"$pr_json")
          head_ref=$(jq -r '.headRefName // ""' <<<"$pr_json")

          # Bot-authored PRs are NOT APPLICABLE to loop coverage (#3011). This mirrors
          # run-presence-check.mjs's botAuthorLogin() branch, which this self-contained template was
          # missing — so adopters using the copy-in workflow had a REQUIRED gate their entire
          # Dependabot fleet could never satisfy: a bot PR has no ORC ticket, and labelling it
          # hand-authored would be a lie of exactly the kind this gate exists to prevent. Structurally
          # unmergeable dependency PRs are a security cost, because the upstream advisory fixes are
          # the ones that stall.
          #
          # This is not a hole in the gate: it asserts provenance rather than waiving it. The match is
          # on GitHub's own `author.is_bot`, with the `[bot]` login suffix as a fallback for older gh
          # versions that omit the field — the same two-part test the checker uses. A human PR cannot
          # claim it: `is_bot` is set by GitHub, and the `[bot]` suffix is reserved for App identities.
          # Both fallback forms are needed. `gh pr view --json author` reports Dependabot as
          # login `app/dependabot` with is_bot=true — NOT `dependabot[bot]`, which is the form
          # the REST/GraphQL actor and `github.actor` use. So a `[bot]`-suffix-only fallback
          # matches nothing on gh's output and would leave the bug in place on any gh build
          # that omits is_bot. Both prefixes are namespaces GitHub reserves for App identities;
          # a human login can contain neither ('/' is not a legal username character).
          author_login=$(jq -r '.author.login // ""' <<<"$pr_json")
          author_is_bot=$(jq -r '.author.is_bot // false' <<<"$pr_json")
          case "$author_login" in
            *'[bot]'|'app/'*) author_is_bot=true ;;
          esac
          if [ "$author_is_bot" = "true" ]; then
            echo "::notice::run-presence-check: PR #$PR_NUMBER loop coverage is not applicable because it is bot-authored by '$author_login'."
            exit 0
          fi

          # Exception-label waiver (#1606): a PR explicitly marked hand-authored (or trivial) is not a
          # loop bypass, so requiring this check never blocks legitimate manual work. Keep this list in
          # sync with run-presence-check's DEFAULT_RUN_PRESENCE_EXEMPT_LABELS. (Self-contained adopters
          # use these defaults; orc's own workflow calls `orc run-presence-check`, which also honors
          # config.run_presence.exempt_labels.)
          labels=$(jq -r '[.labels[]?.name] | join("\n")' <<<"$pr_json")
          for exempt in hand-authored human-authored chore:trivial; do
            if grep -qxF "$exempt" <<<"$labels"; then
              echo "::notice::run-presence-check: PR #$PR_NUMBER waived by the '$exempt' label (hand-authored exception)."
              exit 0
            fi
          done

          ticket_id=$(PR_BODY="$pr_body" HEAD_REF="$head_ref" python3 - <<'PY'
          import os
          import re

          body = os.environ.get("PR_BODY", "")
          head_ref = os.environ.get("HEAD_REF", "")
          # #2511: only the -es forms were matched, so "Fix #123" / "Closed #123" / "Resolves #123"
          # read as NO linked ticket — which skipped enforcement entirely. Every GitHub closing
          # keyword and inflection is recognised now, because an unmatched keyword failed OPEN.
          match = re.search(r"\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b", body, re.I)
          if not match:
              match = re.match(r"^(\d+)(?:[-_/].*)?$", head_ref)
          if match:
              print(match.group(1))
          PY
          )

          if [ -z "$ticket_id" ]; then
            echo "::notice::run-presence-check: PR #$PR_NUMBER has no linked ticket; run-presence is not required."
            exit 0
          fi

          comments_file="$RUNNER_TEMP/orc-run-presence-comments.txt"
          gh api "repos/$REPO/issues/$ticket_id/comments" --paginate --jq '.[].body' > "$comments_file"

          python3 - "$comments_file" "$ticket_id" "$HEAD_SHA" <<'PY'
          import re
          import sys
          from pathlib import Path

          body = Path(sys.argv[1]).read_text(encoding="utf-8")
          ticket_id = sys.argv[2]
          head_sha = (sys.argv[3] if len(sys.argv) > 3 else "").strip().lower()

          # #2511: the attestation must cover the commit being merged. Matching on type alone let
          # ONE finish-pr run satisfy the gate for every later push, so code written after the
          # recorded run merged with no loop coverage — the exact bypass this check exists to stop.
          seen_any = False
          for block in body.split("### ai-evidence")[1:]:
              def field(name):
                  m = re.search(rf"^\s*-\s*{name}:\s*(.+)$", block, re.M)
                  return m.group(1).strip() if m else ""
              if field("type") != "run-presence" or field("status").lower() != "passed":
                  continue
              seen_any = True
              if head_sha and field("commit").lower() == head_sha:
                  print(f"run-presence-check: OK — ticket #{ticket_id} attests the merged commit {head_sha[:7]}")
                  raise SystemExit(0)

          if seen_any:
              print(
                  f"::error::run-presence-check: FAIL — ticket #{ticket_id} has a run-presence attestation, but "
                  f"none covering the commit being merged ({head_sha[:7]}). Commits pushed after the recorded run "
                  "have no loop coverage. Re-run 'orc finish-pr' to attest the current head.",
                  file=sys.stderr,
              )
          else:
              print(
                  f"::error::run-presence-check: FAIL — ticket #{ticket_id} has no passing run-presence attestation. "
                  "Land via 'orc finish-pr' so the loop run is recorded.",
                  file=sys.stderr,
              )
          raise SystemExit(1)
          PY
