# Generated by orc adopt --with-workflows from v8.0.0.
# Copy-in adopter stub for the single-repo fleet-baseline self-check (#2459, epic #1628 slice 4;
# delivered by #2498). Runs on every PR so a repo sees its mandated-floor gaps without waiting for a
# central `orc fleet audit`.
#
# Advisory by construction: `orc fleet baseline-check` exits 0 on a gap unless THIS repo's resolved
# fleet_baseline level is `gated`, so an adopter's PR is not blocked by a floor it has not opted into.
# Copy-in rather than a reusable `uses:` — private->private workflow resolution fails under enterprise
# Actions policy (#1242), the same reason orc-code-guards.yml is copy-in.
name: ORC Fleet Baseline

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: orc-fleet-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  fleet-baseline:
    # A fork PR cannot read ORC_GUARDS_TOKEN, so the private-engine clone cannot succeed there.
    # This advisory, non-required check runs only on same-repo PRs it can authenticate for.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted Ubuntu is the adopter default. To opt into self-hosted,
    # replace with your runner-label JSON array, for example:
    # ["self-hosted","macOS","ARM64"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASH_ENV: ""
    steps:
      - name: Check out this repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "20"

      - name: Fetch orc + run the fleet-baseline self-check (pinned v8.0.0)
        shell: bash
        env:
          # orc is a PRIVATE repo: the workflow-scoped GITHUB_TOKEN is limited to THIS repo and cannot
          # read orc. Provide a PAT or GitHub App installation token with read access to
          # ABD-Enterprises/orc as the ORC_GUARDS_TOKEN secret. (If orc is public to you, github.token
          # works and the secret can be omitted.) The token is masked in logs.
          ORC_GUARDS_TOKEN: ${{ secrets.ORC_GUARDS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Fetch the engine OUTSIDE the workspace so it is never mistaken for the adopter's own tree:
          # baseline-check resolves the repo from its working directory, and a nested engine checkout
          # inside the workspace could be picked up instead.
          engine="${RUNNER_TEMP}/orc-engine"
          rm -rf "$engine"
          # #2578: an adopter that has not provisioned ORC_GUARDS_TOKEN cannot read a private orc, and
          # the `|| github.token` fallback above is repo-scoped, so the clone fails. Under `set -e`
          # that aborts as a bare "exit code 128" and every PR carries a red check that reads like a
          # baseline violation. Failing to FETCH the engine is a setup gap, not a floor gap: report
          # it and skip. A real baseline gap is still reported by the check itself below.
          # #2966: fetch the EXACT engine object rather than a mutable tag, matching the guard
          # bundle. A moved tag would silently change which baseline an adopter is judged against.
          if ! { git clone --depth 1 --filter=blob:none --no-checkout \
                   "https://x-access-token:${ORC_GUARDS_TOKEN}@github.com/ABD-Enterprises/orc.git" "$engine" \
                 && git -C "$engine" fetch --depth 1 origin "f52f3f326222c1c9a3763ee059e80acf74c03b35" \
                 && git -C "$engine" checkout --quiet FETCH_HEAD; } \
               2>"${RUNNER_TEMP}/orc-engine-clone.err"; then
            # The clone URL embeds the token, so stderr is redacted before it reaches the log.
            sed 's/x-access-token:[^@]*@/x-access-token:***@/g' "${RUNNER_TEMP}/orc-engine-clone.err" >&2 || true
            echo "::warning title=ORC fleet baseline did NOT run::Could not fetch the orc engine (ABD-Enterprises/orc @ v8.0.0). If orc is private, set the ORC_GUARDS_TOKEN repository secret to a token with read access to it. This check passed WITHOUT evaluating the baseline."
            # A skipped check is only safe if the skip is visible: state it in the PR's checks UI so
            # "green" cannot be mistaken for "this repo meets the floor".
            {
              echo "### ORC Fleet Baseline — skipped"
              echo ""
              echo "The pinned orc engine could not be fetched, so **the baseline was not evaluated**."
              echo "This check is green because the check is unavailable, not because the repo meets"
              echo "the mandated floor."
              echo ""
              echo "Fix: add an \`ORC_GUARDS_TOKEN\` repository secret with read access to"
              echo "\`ABD-Enterprises/orc\`, then re-run this check."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Run FROM the adopter's workspace: baseline-check resolves the repo and its .ai/config.json
          # from the working directory (cli.mjs passes `cwd: repoRootFn()`), so the engine evaluates
          # THIS repo rather than its own checkout.
          # Past this point a non-zero exit means this repo's resolved floor is `gated` AND it has a
          # real baseline gap — the one thing that should fail an adopter's PR.
          cd "$GITHUB_WORKSPACE"
          node "$engine/tools/orc/cli.mjs" fleet baseline-check
